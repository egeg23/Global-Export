# Демонстрационная площадка прототипа Global Export.
#
#   sudo cp deploy/globalex.nginx.conf /etc/nginx/sites-available/globalex-demo
#   sudo ln -s /etc/nginx/sites-available/globalex-demo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат выпускается после того, как заработает DNS:
#   sudo certbot --nginx -d globalex.maximov-tech.ru
# certbot сам допишет в этот файл блок с ssl_certificate и редирект с 80 порта.

server {
    listen 80;
    listen [::]:80;
    server_name globalex.maximov-tech.ru;

    # Логи отдельно от основного сайта — так видно только трафик демонстрации.
    access_log /var/log/nginx/globalex-demo.access.log;
    error_log  /var/log/nginx/globalex-demo.error.log;

    # Приложение слушает 3100, чтобы не спорить с тем, что уже занимает 3000.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Апгрейд соединения нужен серверным действиям Next.js.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    # Статика Next.js версионируется по имени файла — её можно кешировать
    # надолго и не спрашивать сервер приложения повторно.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Демонстрация закрыта от индексации и на уровне заголовка: одного
    # noindex в разметке мало, если кто-то сошлётся на площадку напрямую.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 12m;   # запас на загрузку фотографий в админку
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
